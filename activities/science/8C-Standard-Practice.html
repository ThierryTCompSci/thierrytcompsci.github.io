function add(parent, tag, value, className) {
  const element = document.createElement(tag);
  if (value) element.textContent = value;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

    input.name = key;

    note,
    check() {
      const selected = inputs.filter(input => input.checked).map(input => Number(input.value));
      const target = multiple ? question.answer : [question.answer];
      if (!selected.length) return "Choose an answer.";
      if (selected.length !== target.length) return `Choose exactly ${target.length} options.`;
      return selected.every((value, index) => value === target[index]) ? "Correct." : "Try again.";
    }
  }];
}

function addFields(group, question, key) {
  return question.items.map((item, index) => {
    const row = add(group, "div", "", "field-row");
    const id = key + "-" + index;
    const label = add(row, "label", item.label);
    label.htmlFor = id;
    const numeric = item.kind === "number";
    const input = add(row, numeric ? "input" : "select");
    input.id = id;
    if (numeric) {
      input.type = "number";
      input.inputMode = "numeric";
      input.step = "any";
    } else {
      const placeholder = add(input, "option", "Choose an answer");
      placeholder.value = "";
      item.options.forEach((option, optionIndex) => {
        add(input, "option", option).value = optionIndex;
      });
    }
    const note = add(row, "div", "", "item-note");
    note.id = id + "-note";
    input.setAttribute("aria-describedby", note.id);
    return {
      note,
      input,
      check() {
        if (input.validity.badInput) return "Enter a number.";
        if (input.value === "") return numeric ? "Enter a number." : "Choose an answer.";
        return Number(input.value) === item.answer ? "Correct." : "Try again.";
      }
    };
  });
}

function addCard(section, activity, index) {
  const form = add(section, "form", "", "card");
  form.noValidate = true;
  const title = add(form, "h3");
  title.id = "activity-" + index;
  form.setAttribute("aria-labelledby", title.id);
  const count = add(title, "span", index, "index");
  count.setAttribute("aria-hidden", "true");
  add(title, "span", activity.title);
  if (activity.stem) add(form, "p", activity.stem, "stem");
  if (activity.visual) form.insertAdjacentHTML("beforeend", activity.visual === "chart" ? chart : table);
  const checks = activity.questions.flatMap((question, questionIndex) => {
    const group = add(form, "fieldset");
    add(group, "legend", question.prompt);
    const key = title.id + "-question-" + questionIndex;
    return question.kind === "fields" ? addFields(group, question, key) : addChoices(group, question, key);
  });
  const button = add(form, "button", "Check answer");
  button.type = "submit";
  const feedback = add(form, "div", "", "feedback");
  feedback.setAttribute("role", "status");
  feedback.setAttribute("aria-atomic", "true");

  function clearFeedback() {
    delete form.dataset.state;
    feedback.replaceChildren();
    delete feedback.dataset.state;
    for (const {note, input} of checks) {
      note.textContent = "";
      delete note.dataset.state;
      input?.removeAttribute("aria-invalid");
    }
    if (correctCards.delete(index)) updateProgress();
  }

  form.addEventListener("input", () => {
    if (form.dataset.state) clearFeedback();
  });
  form.addEventListener("submit", event => {
    event.preventDefault();
    const results = checks.map(({check, note, input}) => {
      const result = check();
      const correct = result === "Correct.";
      note.textContent = result;
      note.dataset.state = correct ? "correct" : "retry";
      input?.setAttribute("aria-invalid", String(!correct));
      return correct;
    });
    const countCorrect = results.filter(Boolean).length;
    const correct = countCorrect === results.length;
    form.dataset.state = feedback.dataset.state = correct ? "correct" : "retry";
    const heading = correct ? "Correct!" : `${countCorrect} of ${results.length} correct. Try again.`;
    feedback.replaceChildren();
    add(feedback, "strong", heading);
    add(feedback, "span", correct ? activity.explain : activity.hint);
    if (correct) correctCards.add(index);
    else correctCards.delete(index);
    updateProgress();
  });
  resetCards.push(() => {
    form.reset();
    clearFeedback();
  });
}

let index = 0;
sections.forEach((topic, topicIndex) => {
  const section = add(practice, "section", "", "unit");
  const title = add(section, "h2", topic.title);
  title.id = "topic-" + (topicIndex + 1);
  section.setAttribute("aria-labelledby", title.id);
  const link = add(add(topics, "li"), "a", topic.title);
  link.href = "#" + title.id;
  topic.tasks.forEach(activity => addCard(section, activity, ++index));
});

reset.addEventListener("click", () => {
  const attempted = practice.querySelector(".card[data-state], input:checked") ||
    [...practice.querySelectorAll("select, input[type='number']")].some(input => input.value !== "");
  if (attempted && !window.confirm("Clear all your answers and start over?")) return;
  resetCards.forEach(resetCard => resetCard());
  updateProgress();
  practice.focus();
});
</script>
